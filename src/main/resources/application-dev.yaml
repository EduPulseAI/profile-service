spring:
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
logging:
  level:
    root: info
    xyz.catuns.edupulse.profile: debug
server:
  port: 8084